name: platform
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Build the embedded chatbot frontend
        run: npm --prefix chatbot ci --include=dev --no-audit --no-fund && npm --prefix chatbot run build
      - run: go build ./...
      - run: go vet ./...
      - name: Go tests (skip real-browser tests)
        run: go test -p=2 ./... -count=1 -timeout=600s -skip "$REAL_BROWSER_TESTS"
        env:
          REAL_BROWSER_TESTS: '^(TestMainBotBrowserStartsAndDrivesRunBrowser|TestBrowserStreamPushesFramesAndRunsCommands|TestRunnerStartsPanelBrowserInRunSandbox|TestBrowserAgentOperationsDriveRealChromium|TestBrowserScrollEndsOnASharpFrame)$'
      - run: python3 scripts/collect-go-notices.py
      - run: python3 scripts/check-public.py
      - run: bash scripts/scan-secrets.sh
        env:
          LOOPFORGE_GITLEAKS_TOKEN: ${{ github.token }}
  platform-required:
    # Keep the stable branch-protection check name.
    name: platform-required
    if: always()
    needs: [core]
    runs-on: ubuntu-latest
    steps:
      - name: Require platform checks to pass
        run: |
          if [[ "${{ needs.core.result }}" != "success" ]]; then
            echo "core=${{ needs.core.result }}" >&2
            exit 1
          fi
