name: validate

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

defaults:
  run:
    working-directory: local

jobs:
  validate:
    # ubuntu-latest is Ubuntu 26.04, and actions/setup-python has no 3.8
    # build for it; each cell pins its runner image via matrix.runner.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.8 has no build for the ubuntu-26.04 runner image that
          # ubuntu-latest now points at, so the 3.8 leg stays on 22.04. Without
          # this the whole job dies in setup-python before any check runs.
          - python-version: "3.8"
            runner: ubuntu-22.04
          - python-version: "3.12"
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - run: python3 -m pip install pyyaml==6.0.3
      - run: bash scripts/validate.sh
      - run: bash scripts/test-observability.sh
      - run: bash scripts/smoke-install.sh
      - run: bash scripts/smoke-npm.sh

  tcmcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - name: Test tcmcp
        working-directory: local/tools/tcmcp
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -e '.[dev]'
          .venv/bin/python -m pytest
      - name: Build frontend
        working-directory: local/tools/tcmcp/web
        run: npm ci && npm run build

  curl-install:
    # Once per workflow, outside the Python 3.8/3.12 matrix. The script
    # installs Classic and Portable from a local fake release and does not
    # contact github.com.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: local
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Smoke-test curl install against a local fake release
        run: bash scripts/smoke-curl-install.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - run: bash scripts/scan-secrets.sh
        env:
          LOOPFORGE_GITLEAKS_TOKEN: ${{ github.token }}
