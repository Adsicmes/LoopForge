name: codeup-image

# Builds the platform image straight from the Codeup branch and publishes it to
# ghcr.io, so the host never has to compile the tree itself. The host runs with
# ~5GB of disk free; a full local build needs more than that and has already
# pushed the root partition to 100% once.
on:
  push:
    branches: [feat/codeup-yunxiao]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: codeup-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Resolve the lowercase image name and tags
        id: image
        shell: bash
        run: |
          # ghcr rejects uppercase in the repository part of an image name.
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          short="${GITHUB_SHA::7}"
          {
            echo "image=${image}"
            echo "short=${short}"
            echo "tags=${image}:codeup-${short}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only: this image is deployed to one x86 host, so arm64 would just
      # burn emulated build minutes on every push.
      - uses: docker/build-push-action@v7
        id: push
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            LOOPFORGE_COMMIT=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.tags }}
            ${{ steps.image.outputs.image }}:codeup-latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report the digest
        run: |
          echo "### codeup image" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- tag: \`${{ steps.image.outputs.tags }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- digest: \`${{ steps.push.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
